services:
  db:
    image: postgres:latest
    container_name: whatsapp_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: whatsapp_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: whatsapp_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
